# Render Blueprint: New > Blueprint > pick this repo. Render asks for the
# values marked sync: false (secrets are never stored in this file).
services:
  - type: web
    name: fileready
    runtime: node
    region: frankfurt        # nearest Render region to the database in Ireland
    plan: free               # demo only; free services sleep when idle. Use starter for pilots.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_PROJECT_REF
        value: xrhzdbvtxrjjupdsgmxl
      - key: S3_BUCKET
        value: documents
      - key: S3_REGION
        value: eu-west-1
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
